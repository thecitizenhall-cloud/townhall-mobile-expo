name: Nightly maintenance

# Runs type-check + dependency audit; if either fails, asks Claude Code to
# prepare a minimal fix on a new branch and open it as a DRAFT PR for human
# review. Never merges, never touches lib/residency.ts or ZK screens, never
# gets Supabase credentials — see
# .github/claude/nightly-maintenance-instructions.md for exact scope.
# Starts on workflow_dispatch only; uncomment the schedule once you've
# watched it run clean a few times (same discipline as the web repo's
# nightly-maintenance.yml).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 9 * * *'   # ~5:23am Eastern

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  check-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @anthropic-ai/claude-code requires node >=22 and the fix
          # step installs it in this job. npm only WARNS on EBADENGINE and
          # installs anyway, so 20 fails later and obscurely. next@16 accepts
          # >=20.9.0 with no ceiling, so the build is unaffected.
          node-version: 22

      - name: Run checks, collect findings
        id: checks
        run: |
          FINDINGS="$RUNNER_TEMP/maintenance-findings.txt"
          echo "findings_path=$FINDINGS" >> "$GITHUB_OUTPUT"
          : > "$FINDINGS"
          FAILED=0

          echo "## npm install" >> "$FINDINGS"
          if ! npm install >> "$FINDINGS" 2>&1; then
            echo "npm install FAILED" >> "$FINDINGS"; FAILED=1
          fi

          echo "## tsc --noEmit" >> "$FINDINGS"
          if ! npx tsc --noEmit >> "$FINDINGS" 2>&1; then
            echo "type check FAILED" >> "$FINDINGS"; FAILED=1
          fi

          echo "## npm audit (production deps)" >> "$FINDINGS"
          if ! npm audit --omit=dev >> "$FINDINGS" 2>&1; then
            echo "npm audit reported vulnerabilities" >> "$FINDINGS"; FAILED=1
          fi

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "----- findings -----"
          cat "$FINDINGS"

      - name: Ask Claude Code to prepare a fix
        if: steps.checks.outputs.failed == '1'
        env:
          # Claude Code runs on the Claude subscription, not API credits. Only this
          # token is set: if ANTHROPIC_API_KEY were also present the CLI could pick it
          # up and bill credits silently. Mint with `claude setup-token`.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pinned: an unpinned global install lets an upstream release change
          # this job's behaviour with no commit on our side.
          npm install -g @anthropic-ai/claude-code@2.1.241

          BRANCH="bot/nightly-maintenance-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "townhall-nightly-bot"
          git config user.email "actions@users.noreply.github.com"

          # Reset any incidental working-tree noise from the checks step's own
          # npm install (e.g. package-lock.json touch-ups) so only changes
          # Claude actually makes below count toward "did it fix something".
          git checkout -- .
          git clean -fd -- . ':!node_modules'

          REPORT="$RUNNER_TEMP/claude-report.txt"
          cat .github/claude/nightly-maintenance-instructions.md "${{ steps.checks.outputs.findings_path }}" | \
            claude -p \
              --model claude-opus-5 \
              --effort high \
              --fallback-model claude-sonnet-5 \
              --allowedTools "Edit,Read,Bash(npm install),Bash(npx tsc*),Bash(npm audit*),Bash(npm view*),Bash(git *)" \
              --output-format text \
              "Read the scope instructions and the findings above (piped via stdin) and prepare a fix per the instructions. Stop and do nothing if nothing in scope is safely fixable. End your reply with the PR body in the exact ## Found / ## Changed / ## Verification / ## Could not safely fix format from the instructions — that's what gets posted as the PR body verbatim." \
            | tee "$REPORT"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit \
              -m "Nightly maintenance: automated fix" \
              -m "Generated from a failed nightly check. See PR body for details." \
              -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin "$BRANCH"
            gh pr create --draft \
              --title "Nightly maintenance: $(date -u +%Y-%m-%d)" \
              --body-file "$REPORT" \
              --base main --head "$BRANCH"
          else
            echo "Claude made no changes — nothing safely fixable in scope. See findings artifact."
          fi

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-findings
          path: ${{ steps.checks.outputs.findings_path }}
          retention-days: 14

      # The web repo's copy of this workflow has had this since it shipped; the
      # mobile copy did not, so a failure here was silent — the only symptom was
      # a nightly that quietly stopped producing anything.
      - name: Alert on unhandled failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ] && { echo "Alert secrets not set; skipping."; exit 0; }
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Townhall Café <alerts@townhallcafe.org>\",\"to\":\"$ALERT_EMAIL\",\"subject\":\"ALERT: mobile nightly-maintenance workflow errored\",\"text\":\"The townhall-mobile-expo nightly-maintenance workflow itself failed (not just a check) - it may need a human look. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
